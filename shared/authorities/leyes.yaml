      verified_by: "MD"
      verified_against: "local:Decreto 1989 - Registro Obrero Patronal.pdf (texto primario completo)"
      official_source_checked: true
      notes: "Fecha: 27-06-2024. Deroga el Decreto 8304/17 (art. 3°). Anexo art. 10: enumera las comunicaciones obligatorias del empleador (inc. 1 entrada/salida de trabajadores; inc. 11 liquidaciones por terminación). El PLAZO no se fija en el decreto: el art. 10 lo delega al MTESS ('dentro de los plazos, orden y modalidad determinados por el MTESS') -> ver Res. MTESS 991/2024. ATENCIÓN: el '30 días' del art. 22 del decreto NO es el plazo de comunicación, es la escala de multa por mora (1 jornal si la mora no supera 30 días; 2 jornales 31-45; 3 jornales 46+). No confundir multa con plazo."

  res_mtess_991_2024:
    official_title: "Resolución MTESS N° 991/2024 - Aprueba el Reglamento para la Inscripción Patronal en el REOP y el Reglamento para las Comunicaciones del Capítulo II del Anexo al Decreto N° 1989/2024"
    short_cite: "Res. MTESS N° 991/2024, Anexo {anexo}, art. {art}"
    jurisdiction: "Paraguay"
