  codigo_trabajo:
    official_title: "Ley N° 213/1993 - Código del Trabajo"
    short_cite: "Ley N° 213, art. {art}"
    jurisdiction: "Paraguay"
    year: 1993
    source_url: "https://www.bacn.gov.py/leyes-paraguayas/2608/ley-n-213-establece-el-codigo-del-trabajo"
    local_source: "local (texto normalizado)"
    verification:
      status: "verified"
      verified_at: "2026-06-06"
      verified_by: "MD"
      verified_against: "local:codigo_del_trabajo_paraguay.md + BACN/2608"
      official_source_checked: true
      notes: "Promulgada 29-10-1993. 398 artículos, 5 libros. Edición OIT 2019. Deroga Ley 729/1961. ANCLAJES de artículos clave (texto verificado): despido justificado causales art. 81; improcedencia de indemnizaciones + complementaria art. 82 (NO es plazo de caducidad); caducidad/condonación de la causal = art. 401 (30 días desde el conocimiento); prescripción general art. 399 (1 año); prescripciones de 60 días art. 400 (inc. c: acción para dar por terminado el contrato por causas legales); recargos salariales art. 234; certificado de trabajo art. 93; indemnización por despido art. 91; preaviso art. 87. ANCLAJES trabajo transfronterizo (verificados 2026-07-02): art. 23 (el CT NO rige para directores/gerentes/administradores con notoria independencia; rige si predomina la subordinación — clave para socio-administrador que se 'auto-emplea'); art. 46 inc. c (el contrato consigna 'el lugar o lugares de su prestación' = lugar de EJECUCIÓN física del trabajo, no del aprovechamiento del resultado); art. 48 (presunción de relación laboral con prestación subordinada); art. 57 (contrato de trabajadores paraguayos para servicios FUERA del país: aprobación y registro por la autoridad administrativa del trabajo + visado consular + cláusulas obligatorias de transporte, fianza de repatriación y edad mínima 20 años); art. 67 inc. l (derecho a repatriación por cuenta del empleador)."

