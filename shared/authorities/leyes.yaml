  res_mtess_564_2026:
    official_title: "Resolución MTESS N° 564/2026 - Por la cual se modifica parcialmente la Resolución MTESS N° 195/2026, de fecha 10 de marzo de 2026, por la cual se aprueban los lineamientos de prevención, atención, investigación y respuesta ante situaciones de discriminación, violencia y acoso en el mundo del trabajo en el sector privado"
    short_cite: "Resolución MTESS N° 564/2026, art. {art}"
    jurisdiction: "Paraguay"
    year: 2026
    source_url: null
    local_source: "local (PDF primario)"
    related:
      - "Modifica parcialmente la Res. MTESS 195/2026 (ver res_mtess_195_2026)"
    verification:
      status: "verified"
      verified_at: "2026-07-19"
      verified_by: "MD"
      verified_against: "local:Res MTESS 564-2026 - Modifica Res 195-2026 Violencia Laboral.pdf (texto primario completo, 7 págs.)"
      official_source_checked: true
      notes: "Firmada electrónicamente el 27-05-2026 (art. 8°: la fecha de la resolución es la de la firma electrónica de la Máxima Autoridad; Ministra Mónica Recalde). Exp. 2026-12015001-006856 del 25-05-2026 (Dir. Gral. de Promoción a la Mujer Trabajadora). CONTENIDO: art. 2° redefine 'Espacio de trabajo' (Anexo I punto 3.i) con 4 ámbitos (instalaciones; espacios de descanso/alimentación/higiene provistos o autorizados; desplazamientos/viajes/actividades organizadas o autorizadas; comunicaciones vinculadas al trabajo, incl. telemáticas) y EXCLUYE hechos sin 'relación directa, objetiva y verificable con la prestación laboral'. Art. 3°: en toda la Res. 195/2026, 'mundo del trabajo' se entiende sustituido por 'espacio de trabajo'. Art. 4° reescribe el punto 16 (violencia de TERCEROS: solo medidas razonables y proporcionales; sin incumplimiento por hechos no previsibles, evitables o controlables). Art. 5° reescribe el punto 17 (denuncia verbal o escrita, presencial o electrónica, ante MTESS o empresa; la presentación ante una instancia es EXCLUYENTE de la otra mientras el procedimiento esté en curso, salvo inacción o incumplimiento acreditado; denuncia contra la máxima autoridad o representante del empleador según art. 25 CT va DIRECTAMENTE al MTESS; contenido mínimo incs. a-d; NO se admiten denuncias anónimas). Art. 7°: mantiene vigente lo no modificado — los plazos 3/30/3 días hábiles de la 195/2026 NO cambian. Norma citada por la skill sumarios-acoso."

