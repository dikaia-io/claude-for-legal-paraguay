      - "DL 1860/50 art. 2 (Seguro General Voluntario)"
      - "Ley 4290/2011 (jubilación proporcional, referida por el art. 4.a)"
    verification:
      status: "verified"
      verified_at: "2026-07-19"
      verified_by: "MD"
      verified_against: "BACN/4395 (HTML íntegro de la página oficial) + PDF oficial BACN escaneado leído completo en sesión (local:ley_4933_2013_seguro_voluntario_ips.md)"
      official_source_checked: true
      notes: "Sancionada: Senadores 14-03-2013, Diputados 07-05-2013; promulgada 05-06-2013; publicada 13-11-2013. Texto completo (7 arts.) leído contra HTML BACN y cotejado con el PDF oficial. ALCANCE CONFIRMADO — art. 1° in fine: la afiliación voluntaria es SOLO al Fondo Común de Jubilaciones y Pensiones; 'Esta Ley no comprende las prestaciones médicas y asistenciales proveídos por el Seguro Social' → el canal previsional lícito del socio-administrador (excluido del CT por el art. 23) NO incluye seguro de salud IPS por esta vía. Sujetos (art. 2): definiciones del art. 76 incs. b y d del DL 1860/50 + art. 148 CT (doméstico). Aporte (art. 3): 13% sobre base ≥ 1 salario mínimo, elegida por el afiliado (12,5% jubilaciones + 0,5% administración). Prestaciones de largo plazo (art. 4): edad avanzada (60 años + 25 de aporte → 100% del promedio de los últimos 120 meses; 55 + 30 → 80% +4%/año hasta 59; 65 años + 750 semanas → proporcional Ley 4290/11 desde 15 años, 60%); invalidez y sobrevivencia según arts. 61-62 DL 1860/50 (texto Ley 98/92). Supletoria: DL 1860/50 (art. 5). Vigencia a los 60 días de la promulgación (art. 6)."

  ley_1110_1985:
    official_title: "Ley N° 1110/1985 - Que establece el Régimen de Notificaciones Judiciales"
    short_cite: "Ley N° 1110/1985, art. {art}"
    jurisdiction: "Paraguay"
    year: 1985
    source_url: null
    local_source: null
    related:
      - "CPC (Ley 1337/1988) arts. 131-133: régimen de notificación automática martes/jueves que la absorbe para el fuero civil"
    verification:
      status: "draft"
      verified_at: null
      verified_by: null
      verified_against: null
      official_source_checked: false
      notes: "Del 31-05-1985. IDENTIDAD CORREGIDA (2026-07-19, texto hallado en Justia Paraguay, fuente NO oficial): es una ley GENERAL de notificaciones judiciales, NO una modificatoria nominal del art. 81 CPT. Según ese texto: art. 1° notificación automática en Secretaría los MARTES y JUEVES (o día hábil siguiente si feriado; no se computa si el expediente no está en Secretaría); arts. 3-5 actos que exigen cédula/personal; art. 7° rige en juicios civiles, comerciales, criminales y contencioso-administrativos y EXCLUYE EXPRESAMENTE quiebras, FUERO LABORAL, menores y Justicia de Paz Letrada ('se rigen por leyes especiales'); art. 9° sábado inhábil; art. 10 derogación genérica. TRAMPA DE AUTORIDAD DETECTADA: esta ley NO puede citarse como fuente de los 'días de nota' martes/jueves del fuero laboral (su art. 7 lo excluye). El CPT art. 81 originario dice 'lunes, miércoles y viernes' y NO se halló norma que lo modifique; la práctica forense laboral real es martes/jueves, vía plausible: CPT art. 6 (remisión al CPC — cuyo art. 131 fija martes/jueves, verificado — y a 'la costumbre o el uso local en materia de procedimiento'). REGLA PARA SKILLS: citar martes/jueves en el fuero laboral como práctica forense uniforme con ancla normativa indirecta (CPT art. 6 + CPC art. 131), NUNCA como texto del art. 81 CPT ni como efecto de la Ley 1110/1985; la afirmación puntual lleva [VERIFICAR VIGENCIA]. BACN no indexa esta ley (la 'Ley 1110' de BACN id 10608 es la homónima de 1997, presupuesto UNA — no confundir). [FUENTE OFICIAL PENDIENTE] para el texto de la 1110/1985 (Gaceta Oficial / PJ)."

