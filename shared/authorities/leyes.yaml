      verified_by: "MD"
      verified_against: "local:Res MTESS 991 - Reglamento Inscripcion Patronal.pdf (texto primario completo)"
      official_source_checked: true
      notes: "Fecha: 17-10-2024. Fija los plazos delegados por el Decreto 1989/2024, vía sistema REOP. Comunicación de SALIDA de trabajadores (Anexo N° 2, Cap. III, art. 11): dentro de los 30 DÍAS HÁBILES desde que el trabajador dejó de prestar servicios. Art. 10 del mismo anexo: la documentación de salida es según Art. 78/81/84 CT o despido/retiro injustificado (hay que declarar el motivo). Otros plazos del Anexo 2: entrada 30 días hábiles (art. 7); accidentes laborales 8 días corridos (art. 27); aguinaldo dentro de los primeros 5 días hábiles del año (art. 39). Inscripción patronal: confirmada en 3 días hábiles (Anexo 1, art. 5). Deja sin efecto arts. 1° y 3° de la Res. MTESS 835/2016."

