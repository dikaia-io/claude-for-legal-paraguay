  aporte_ips:
    official_title: "Decreto-Ley N° 1860/1950 - Carta Orgánica del IPS (aprob. Ley 375/1956), arts. 2 y 17, redacción Ley 3990/2010"
    short_cite: "DL 1860/50, art. {art}"
    jurisdiction: "Paraguay"
    year: 1950
    source_url: "https://www.bacn.gov.py/leyes-paraguayas/933/modifica-los-articulos-2-17-inciso-a-y-24-del-decreto-ley-n-186050-aprobado-por-ley-n-37556-modificados-por-el-articulo-2-de-la-ley-n-9892"
    local_source: null
    modified_by:
      - "Ley 98/1992 (art. 2° fija aporte obrero en 9%)"
      - "Ley 2263/2003 (modifica parcialmente Ley 98/92)"
      - "Ley 3990/2010 (nueva redacción de los arts. 2, 17 inc. a y 24 — texto vigente verificado contra BACN/933)"
    related:
      - "Ley 5407/2015 (aporte obrero 9% en trabajo doméstico)"
      - "Ley 4933/2013 (incorporación voluntaria de independientes, empleadores, amas de casa y domésticos)"
      - "Ley 7446/2025 (reforma IPS — jubilaciones; en repositorio local, pendiente de anclar)"
    verification:
      status: "verified"
      verified_at: "2026-07-02"
      verified_by: "MD"
      verified_against: "BACN/933 (Ley 3990/2010, texto completo de los arts. 2 y 17 vigentes) + texto art. 17 inc. a aportado en sesión (2026-06-30)"
      official_source_checked: true
      notes: "Aporte obrero IPS = 9% del salario (art. 17 inc. a) — ÚNICO descuento al trabajador en la liquidación. Reparto según texto legal verificado (Ley 3990/2010): trabajador 9% (art. 17.a) + empleador 14% (art. 17.b) + Estado 1,5% (art. 17.c). La práctica administrativa refiere tasa patronal total 16,5% (14% + 2,5% SENEPA/SNPP, este último [VERIFICAR VIGENCIA] de su norma). Los aportes patronales NO se descuentan al trabajador. Base de descuento del 9%: todo menos aguinaldo. ÁMBITO (art. 2, texto Ley 3990/2010 verificado): sujetos del seguro social = 'los trabajadores asalariados que prestan servicios o ejecutan una obra en virtud de un contrato de trabajo, verbal o escrito, cualquiera sea su edad y el monto de la remuneración' — SIN limitación territorial expresa (relevante para trabajo transfronterizo: la afiliación de un trabajador con contrato paraguayo prestando servicios en el exterior no está textualmente excluida; la territorialidad opera vía práctica y convenios bilaterales). El mismo art. 2 crea el Seguro General Voluntario para el trabajador independiente. Excepciones (art. 2 in fine): Administración Central, bancos, FFAA/Policía, ferrocarril con caja propia."

  decreto_1989_2024:
    official_title: "Decreto N° 1989/2024 - Actualiza las disposiciones sobre inscripción en el Registro Obrero Patronal (REOP), documentos y libros de tenencia obligatoria, comunicaciones y transmisión de datos electrónicos ante el MTESS"
