  ley_3283_2007:
    official_title: "Ley N° 3283/2007 - De Protección de la Información no Divulgada y Datos de Prueba para los Registros Farmacéuticos"
    short_cite: "Ley N° 3283/2007, art. {art}"
    jurisdiction: "Paraguay"
    year: 2007
    source_url: "https://www.bacn.gov.py/leyes-paraguayas/3331/"
    local_source: null
    verification:
      status: "verified"
      verified_at: "2026-07-02"
      verified_by: "MD"
      verified_against: "LegalDataHunter:PY/BACN/PY_BACN_3331 (texto completo)"
      official_source_checked: true
      notes: "Promulgada 03-09-2007, publicada 19-09-2007. El TÍTULO sugiere ámbito farmacéutico, pero el Cap. I (arts. 1-8) contiene una protección sustantiva GENERAL de secretos industriales y comerciales, no limitada a fármacos: art. 1 (objeto: protección de la información no divulgada relativa a secretos industriales y comerciales), art. 2 y art. 3.B (define 'adquisición contraria a los usos comerciales honestos', incluyendo expresamente el incumplimiento de cláusulas de confidencialidad en contratos), art. 5 (deber de abstenerse de usar/revelar información confidencial conocida por trabajo, empleo, profesión o relación de negocios) y art. 8 (acciones civiles). Los Cap. II-IV (arts. 9-14) sí son específicos de registros farmacéuticos. MATIZ: el plazo de 3 años del art. 7 está anclado a la presentación ante la autoridad sanitaria; NO citar ese plazo para NDAs genéricos fuera del ámbito farmacéutico/sanitario. Ancla estatutaria directa del NDA en Paraguay para la protección sustantiva (arts. 1/2/3.B/5/8), no para el plazo (art. 7). Aplicación a NDAs genéricos sin jurisprudencia verificada — toda afirmación de aplicación judicial concreta fuera del ámbito farmacéutico/sanitario lleva [INSERTAR JURISPRUDENCIA VERIFICADA]. Verificada en tarea 0.3 (fase 4); cargada al map en tarea pendiente de 0.3. Ver verification-log.md → nda_ancla_ley3283_2007_secretos / nda_decision_ancla_final."

