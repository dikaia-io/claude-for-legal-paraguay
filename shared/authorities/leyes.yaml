      official_source_checked: true
      notes: "Consolidación de trabajo al 2026-04-03 a partir de leyes BACN. Ley 7614/2025 NO modifica el articulado (solo relacionada). ANCLAJES verificados 2026-07-05 (plugin paraguay-litigacion) contra el texto consolidado: PROCESO ORDINARIO — demanda art. 215 (incs. a-f + monto); documental art. 219; traslado y plazo de contestación 18 días arts. 222/234; excepciones previas arts. 223-224 (lista taxativa incl. convenio arbitral y arraigo); contestación art. 235; reconvención arts. 237-240; puro derecho 241-242; prueba arts. 243-269 (máx. 40 días art. 253; ofrecimiento 10 primeros días; posiciones 20 primeros días art. 277); alegatos 6 días por su orden art. 379; llamamiento de autos 382-383; plazos para resolver art. 162 (S.D. 40/60 días); diligencias preparatorias arts. 209-214 (caducidad 15 días). JUICIO EJECUTIVO — arts. 439-475 completos (procedencia 439; opción ordinaria 440; inapelabilidad 442; preparación 443-447, caducidad 20 días 447; títulos 448-449; intimación/embargo 450-456; costas 457; ampliaciones 458-459; pago 3er día y excepciones 5 días art. 460; irrenunciables 461; excepciones taxativas 462; nulidad 463; no causa 465; trámite 466-469; sentencia de remate 470 — OJO: epígrafe local dice 'Juicio posterior', error de epígrafe, contenido correcto; ordinario posterior 60 días 471; apelación 472; fianza 473 (remite art. 1457 CC); cumplimiento 475-479 y 501-502). EJECUCIONES ESPECIALES — hipotecaria 503-507 (excepciones 504; prelación 507); prendaria 508-510; dar cosa mueble 511-518; ejecución de resoluciones 519 y ss. El art. 480 (subasta de inmuebles) tiene texto según Ley 7424/2025. LAGUNA RESUELTA (2026-07-19): art. 114 inc. b, confirmación tácita de la nulidad = CINCO DÍAS desde el conocimiento del acto viciado — el número faltaba en la copia local, en la base del estudio Y en el HTML de BACN (laguna de transcripción de linaje común); verificado contra el escaneo oficial del texto original promulgado (PJ/CSJ, csj.gov.py/cache/lederes/P-1-011988-L