      official_source_checked: true
      notes: "Sancionada: Senadores 04-12-2014, Diputados 17-12-2014; promulgada 14-01-2015; publicada 20-01-2015. Texto completo (19 arts.) leído contra HTML BACN y cotejado con el PDF oficial. ANCLA de la exclusión: **art. 1° in fine** — 'Sus disposiciones no se aplican a contratos de consumo, a contratos de trabajo, ni a contratos de franquicia, representación, agencia y distribución' → la elección de derecho en un contrato laboral internacional NO puede apoyarse en esta ley; rige la lex loci executionis. Otras anclas: art. 4 (libertad de elección, sin vínculo exigido); art. 6 (elección expresa o tácita; cláusula de foro ≠ elección de derecho); art. 11 (sin elección: vínculos más estrechos); art. 13 (alcance del derecho elegido: interpretación, incumplimiento, prescripción, nulidad); art. 17 (leyes de policía paraguayas prevalecen + orden público); art. 18 (inaplica arts. 14, 17, 297, 687 y 699 CC a contratos internacionales). OJO art. 3°: la enumeración oficial es a), b), c), e), f) — NO EXISTE inciso d) en el texto promulgado (verificado contra HTML y PDF; no citar un 'art. 3 inc. d')."

  ley_4933_2013_seguro_voluntario:
    official_title: "Ley N° 4933/2013 - Autoriza la incorporación voluntaria de trabajadores independientes, empleadores, amas de casa y trabajadores domésticos al Seguro Social - Fondo de Jubilaciones y Pensiones del IPS"
    short_cite: "Ley N° 4933/2013, art. {art}"
    jurisdiction: "Paraguay"
    year: 2013
    source_url: "https://www.bacn.gov.py/leyes-paraguayas/4395/ley-n-4933--autoriza-la-incorporacion-voluntaria-de-trabajadores-independientes-empleadores-amas-de-casa-y-trabajadores-domesticos-al-seguro-social--fondo-de-jubilaciones-y-pensiones-del-instituto-de-prevision-social"
    local_source: null
