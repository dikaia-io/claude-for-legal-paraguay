  res_mtess_346_2024:
    official_title: "Resolución MTESS N° 346/2024 - Por la cual se deja sin efecto la Resolución MTESS N° 47/2016, la Resolución MTESS 56/2017, se derogan los artículos 3° y 4° de la Resolución MTESS 29/2023 y se aprueba el Manual de Procedimiento de Inspección y Fiscalización Laboral, contenido en el Anexo I de la presente Resolución"
    short_cite: "Resolución MTESS N° 346/2024, {parte}"
    jurisdiction: "Paraguay"
    year: 2024
    source_url: null
    local_source: "local (PDF primario firmado + Anexo I Manual, 69 págs.)"
    derogates:
      - "Res. MTESS 47/2016 (procedimiento general de inspección anterior; había dejado sin efecto la Res. 622/2015) - art. 1°"
      - "Res. MTESS 56/2017 (ampliación del reglamento de trámite administrativo de verificación) - art. 2°"
      - "Res. MTESS 29/2023, arts. 3° y 4° - art. 3°"
    verification:
      status: "verified"
      verified_at: "2026-07-19"
      verified_by: "MD"
      verified_against: "local:Res MTESS 346-2024 - Manual Inspeccion y Fiscalizacion.pdf (facsímil del documento oficial firmado, 69 págs. con OCR; parte resolutiva y estructura del Manual leídas en sesión)"
      official_source_checked: true
      notes: "Asunción, 21-05-2024. Firmada por la Ministra Mónica Recalde de Giacomi. Art. 4°: aprueba el Manual de Procedimiento de Inspección y Fiscalización Laboral (Anexo I, 64 fojas), alineado al Convenio OIT 81; art. 5°: implementación por el Viceministerio de Trabajo vía Dir. Gral. de Inspección y Fiscalización. El Manual regula el procedimiento completo: emisión de la Orden de Inspección y Fiscalización (OIF) de oficio, por denuncia particular/gremial o por requerimiento público/fiscal/judicial; plazo de validez de la OIF; etapas, visitas, entrevistas, y conclusión con informe final o acta de infracción. PROCEDENCIA del PDF: facsímil del documento oficial firmado obtenido de vouga.com.py (2026-07-19); el portal MTESS no expone URL directa estable — si aparece publicación oficial en mtess.gov.py, cargar source_url. Los PLAZOS puntuales del Manual (validez OIF, comparecencias, duración total) deben citarse contra la página exacta del Anexo I antes de usarse en una skill. Citada por la skill sumarios-mtess."

  oit_c190:
    official_title: "Convenio OIT N° 190 (2019) y Recomendación N° 206 - Violencia y acoso en el mundo del trabajo"
    short_cite: "Convenio OIT N° 190"
    jurisdiction: "Internacional"
    year: 2019
    source_url: null
    local_source: null
    verification:
      status: "verified"
      verified_at: "2026-07-19"
      verified_by: "MD"
      verified_against: "BACN (sin ley aprobatoria del C190, verificado 2026-06-30) + lista de ratificaciones del C190 derivada de NORMLEX (consultada 2026-07-19: Paraguay ausente entre los 55 Estados ratificantes)"
      official_source_checked: true
      notes: "ESTADO CONFIRMADO (2026-07-19): Paraguay NO ratificó el Convenio OIT N° 190. Doble anclaje: (1) BACN no registra ley aprobatoria — y sin ley aprobatoria del Congreso (CN arts. 141 y 202 num. 9) un tratado NO es derecho interno paraguayo (sí figuran el C182 Ley 1657/2001 y el C189 Ley 4819/2012); (2) la lista de ratificaciones del C190 (55 Estados al 2026, según NORMLEX — el acceso directo a normlex.ilo.org está bloqueado a fetchers, consultada vía réplica) no incluye a Paraguay; en Sudamérica ratificaron Uruguay (2020), Argentina (2021), Ecuador (2021), Perú (2022) y Chile (2023). REGLA PARA SKILLS: tratarlo como soft law / referencia interpretativa (la Res. MTESS 195/2026 se inspira en su enfoque), NUNCA citarlo como norma vinculante ni como derecho interno vigente. Si se afirma la ratificación futura, re-verificar contra NORMLEX."
