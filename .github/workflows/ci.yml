# CI del proyecto — corre en cada push a main y en cada pull request.
#
# La matriz Windows/Linux protege la portabilidad del paquete. Todos los
# controles fallan cerrado: estado, estructura, privacidad, autoridades,
# tests y construcción del ZIP instalable.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validar:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Instalar dependencias de validación
        run: pip install pyyaml jsonschema

      - name: Validar estado y versiones
        run: python scripts/check_project_status.py

      - name: Validar estructura de plugins y skills
        run: python scripts/validate_plugins.py

      - name: Guarda de datos sensibles
        run: python scripts/check_sensitive.py --all

      - name: Validar mapa de autoridad
        run: python scripts/validate_authorities.py --strict

      - name: Tests del empaquetador y controles
        run: python -m unittest discover -s scripts/tests -v

      - name: Construir paquete
        run: python scripts/build_project_knowledge.py --zip

      - name: Probar paquete
        run: python scripts/test_paquete.py build/paquete-claude-ai.zip
